<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Unifutbol Scout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        select {
            padding: 8px;
            margin-bottom: 20px;
            font-size: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 6px;
            font-size: 12px;
        }
        th {
            background: #333;
            color: white;
        }
        tr:nth-child(even) {
            background: #eee;
        }
    </style>
</head>
<body>

<h1>Unifutbol Scout</h1>

<label>Filtrar por equipo (CodEquipo):</label>
<select id="filtro-equipo">
    <option value="">Todos</option>
</select>

<table>
    <thead></thead>
    <tbody></tbody>
</table>

<script>
const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTa1OMKOtrrTqrSXDtDkHy-23TEcdkMPRUObduI0_8wasPPvO4XC5n1u8oOpXf3qkyq5U9qeIoeHKaF/pub?gid=0&single=true&output=csv";

fetch(url)
    .then(response => response.text())
    .then(csv => {

        const rows = csv.split("\n").map(r => r.split(";"));
        const headers = rows[0];

        const thead = document.querySelector("thead");
        const headerRow = document.createElement("tr");

        headers.forEach(h => {
            const th = document.createElement("th");
            th.textContent = h;
            headerRow.appendChild(th);
        });

        thead.appendChild(headerRow);

        const tbody = document.querySelector("tbody");
        const filtro = document.getElementById("filtro-equipo");

        const equipos = new Set();

        rows.slice(1).forEach(row => {
            const equipo = row[headers.indexOf("CodEquipo")];
            if (equipo) equipos.add(equipo);
        });

        equipos.forEach(eq => {
            const option = document.createElement("option");
            option.value = eq;
            option.textContent = eq;
            filtro.appendChild(option);
        });

        function mostrarFiltrado() {
            const valor = filtro.value;
            tbody.innerHTML = "";

            rows.slice(1).forEach(row => {
                const equipo = row[headers.indexOf("CodEquipo")];

                if (valor === "" || equipo === valor) {
                    const tr = document.createElement("tr");

                    row.forEach(cell => {
                        const td = document.createElement("td");
                        td.textContent = cell;
                        tr.appendChild(td);
                    });

                    tbody.appendChild(tr);
                }
            });
        }

        mostrarFiltrado();
        filtro.addEventListener("change", mostrarFiltrado);
    });
</script>

</body>
</html>
